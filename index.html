<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Salon Casino — Ticket</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0e0d;--paper:#faf6f0;--ink:#1a1612;
  --red:#c0392b;--gold:#c8a45a;--muted:#666;
  --border:#2a2620;--radius:4px;
  --mono:'IBM Plex Mono','Courier New',Courier,monospace;
  --display:'Bebas Neue',sans-serif;
}
body{background:var(--bg);min-height:100vh;font-family:var(--mono);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 12px 60px;color:var(--paper);}
.site-header{width:100%;max-width:440px;display:flex;align-items:baseline;gap:12px;
  margin-bottom:28px;opacity:0;transform:translateY(-16px);}
.site-header h1{font-family:var(--display);font-size:clamp(28px,7vw,42px);
  letter-spacing:2px;color:var(--gold);line-height:1;}
.site-header span{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
.layout{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;}
.card{background:#1a1814;border:1px solid var(--border);border-radius:6px;padding:16px;opacity:0;transform:translateY(20px);}
.card-title{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
input{background:#0f0e0d;border:1px solid var(--border);border-radius:var(--radius);
  color:var(--paper);font-family:var(--mono);font-size:13px;padding:8px 10px;
  width:100%;transition:border-color .2s;text-transform:uppercase;}
input:focus{outline:none;border-color:var(--gold);}
.pago-toggle{display:flex;gap:8px;}
.pago-btn{flex:1;padding:9px;border-radius:var(--radius);border:1px solid var(--border);
  background:#0f0e0d;color:var(--muted);font-family:var(--mono);font-size:11px;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.pago-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700;}
.productos-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.producto-row{display:grid;grid-template-columns:44px 1fr 80px 32px;gap:6px;align-items:center;}
.producto-row input{padding:7px 8px;font-size:12px;}
.btn-remove{background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:var(--radius);width:32px;height:36px;cursor:pointer;font-size:18px;
  transition:all .2s;display:flex;align-items:center;justify-content:center;}
.btn-remove:hover{border-color:var(--red);color:var(--red);}
.btn-add{background:none;border:1px dashed var(--border);color:var(--muted);
  border-radius:var(--radius);width:100%;padding:9px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:all .2s;}
.btn-add:hover{border-color:var(--gold);color:var(--gold);}
.ticket-preview{background:var(--paper);color:var(--ink);border-radius:6px;
  padding:20px 16px;font-family:var(--mono);font-size:11px;line-height:1.6;
  white-space:pre;overflow-x:auto;opacity:0;transform:translateY(20px);position:relative;}
.ticket-preview::before{content:'VISTA PREVIA';position:absolute;top:-10px;left:16px;
  background:var(--gold);color:var(--ink);font-size:8px;letter-spacing:3px;
  padding:2px 8px;border-radius:2px;font-weight:700;}
.ticket-preview .b{font-weight:700;}
.actions{display:flex;gap:10px;opacity:0;}
.btn-print{flex:1;background:var(--gold);color:var(--ink);border:none;
  border-radius:var(--radius);font-family:var(--mono);font-size:12px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;padding:14px;cursor:pointer;transition:all .2s;}
.btn-print:hover{background:#d4a830;transform:translateY(-1px);}
.btn-dl{background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:var(--radius);font-family:var(--mono);font-size:11px;
  letter-spacing:2px;text-transform:uppercase;padding:14px 16px;cursor:pointer;transition:all .2s;}
.btn-dl:hover{border-color:var(--paper);color:var(--paper);}
.cols-label{display:grid;grid-template-columns:44px 1fr 80px 32px;gap:6px;margin-bottom:4px;}
.cols-label span{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
</style>
</head>
<body>
<header class="site-header">
  <h1>Salon Casino</h1>
  <span>Generador de Ticket</span>
</header>
<div class="layout">
  <div class="card">
    <div class="card-title">Negocio</div>
    <div class="grid-2">
      <div class="field full"><label>Nombre</label><input id="nombre" value="RESTAURANTE SALON CASINO"/></div>
      <div class="field full"><label>Direccion (opcional)</label><input id="direccion" placeholder="CALLE, COL., CIUDAD"/></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Orden</div>
    <div class="grid-2">
      <div class="field"><label>Folio</label><input id="folio" value="001234"/></div>
      <div class="field"><label>Fecha</label><input id="fecha" type="date"/></div>
      <div class="field"><label>Mesa</label><input id="mesa" value="18"/></div>
      <div class="field"><label>Hora</label><input id="hora" type="time"/></div>
      <div class="field"><label>Personas</label><input id="personas" value="3"/></div>
      <div class="field"><label>Orden #</label><input id="orden" value="4"/></div>
      <div class="field full"><label>Mesero</label><input id="mesero" value="TELLEZ HERNANDEZ PEDRO"/></div>
      <div class="field full"><label>Terminal</label><input id="terminal" value="2-PDV1"/></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Productos</div>
    <div class="cols-label">
      <span>Cant</span><span>Descripcion</span><span>Importe</span><span></span>
    </div>
    <div class="productos-list" id="productosList"></div>
    <button class="btn-add" id="btnAdd">+ Agregar producto</button>
  </div>
  <div class="card">
    <div class="card-title">Totales</div>
    <div class="grid-2">
      <div class="field"><label>Total articulos</label><input id="totalArts" value="36"/></div>
      <div class="field"><label>Subtotal</label><input id="subtotal" value="$1,545.00"/></div>
      <div class="field"><label>IVA (16%)</label><input id="iva" value="$247.20"/></div>
      <div class="field"><label>Total</label><input id="total" value="$1,792.00"/></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Pago</div>
    <div class="grid-2">
      <div class="field full"><label>Forma de pago</label>
        <div class="pago-toggle">
          <button class="pago-btn active" id="btnEfectivo">Efectivo</button>
          <button class="pago-btn" id="btnTerminal">Terminal</button>
        </div>
      </div>
      <div class="field" id="campoRecibido">
        <label>Monto recibido</label><input id="recibido" value="$1,800.00"/>
      </div>
      <div class="field" id="campoCambio">
        <label>Cambio</label><input id="cambio" value="$7.80"/>
      </div>
    </div>
  </div>
  <div class="ticket-preview" id="ticketPreview"></div>
  <div class="actions">
    <button class="btn-dl" id="btnDl">Descargar .py</button>
    <button class="btn-print" id="btnPrint">Imprimir Ticket</button>
  </div>
</div>
<script>
(function(){
var pago='EFECTIVO';
var SEP='********************************';
var ini=[
  {c:'6',d:'TLACOYO DE FRIJOL',p:'$0.00'},
  {c:'1',d:'FRIJOLES CHARROS',p:'$80.00'},
  {c:'1',d:'COCA COLA',p:'$240.00'},
  {c:'2',d:'SPRITE',p:'$120.00'},
  {c:'2',d:'SOPA AZTECA',p:'$240.00'},
  {c:'1',d:'CALDO TLALPENO',p:'$140.00'},
  {c:'2',d:'ENCHILADAS VERDES',p:'$360.00'},
  {c:'1',d:'PASTAS AL HORNO',p:'$145.00'},
  {c:'3',d:'BOTANA',p:'$0.00'},
  {c:'1',d:'TAMPIQUENA',p:'$220.00'}
];
var now=new Date();
document.getElementById('fecha').value=now.toISOString().split('T')[0];
document.getElementById('hora').value=now.toTimeString().slice(0,5);

function up(el){
  el.addEventListener('input',function(){
    if(this.type!=='date'&&this.type!=='time') this.value=this.value.toUpperCase();
    refresh();
  });
}
document.querySelectorAll('input').forEach(up);

function addRow(c,d,p){
  c=c||'1'; d=(d||'').toUpperCase(); p=p||'';
  var list=document.getElementById('productosList');
  var row=document.createElement('div');
  row.className='producto-row';
  var i0=mk('input'); i0.value=c; i0.placeholder='1';
  var i1=mk('input'); i1.value=d; i1.placeholder='DESCRIPCION';
  var i2=mk('input'); i2.value=p; i2.placeholder='$0.00';
  var btn=document.createElement('button');
  btn.className='btn-remove'; btn.innerHTML='&times;';
  btn.addEventListener('click',function(){
    gsap.to(row,{opacity:0,x:10,duration:.2,onComplete:function(){row.remove();refresh();}});
  });
  [i0,i1,i2].forEach(up);
  [i0,i1,i2,btn].forEach(function(el){row.appendChild(el);});
  list.appendChild(row);
  gsap.from(row,{opacity:0,x:-10,duration:.25});
  refresh();
}
function mk(tag){var el=document.createElement(tag||'input');return el;}

function getRows(){
  return Array.from(document.querySelectorAll('.producto-row')).map(function(r){
    var ii=r.querySelectorAll('input');
    return{c:ii[0].value.toUpperCase(),d:ii[1].value.toUpperCase(),p:ii[2].value.toUpperCase()};
  });
}

document.getElementById('btnEfectivo').addEventListener('click',function(){setPago('EFECTIVO');});
document.getElementById('btnTerminal').addEventListener('click',function(){setPago('TERMINAL');});
function setPago(t){
  pago=t;
  document.getElementById('btnEfectivo').classList.toggle('active',t==='EFECTIVO');
  document.getElementById('btnTerminal').classList.toggle('active',t==='TERMINAL');
  var show=t==='EFECTIVO';
  document.getElementById('campoRecibido').style.display=show?'':'none';
  document.getElementById('campoCambio').style.display=show?'':'none';
  refresh();
}
document.getElementById('btnAdd').addEventListener('click',function(){addRow();});

function pd(s,n,r){s=String(s);return r?s.padStart(n):s.padEnd(n);}
function ctr(s,W){s=s.slice(0,W);return s.padStart(Math.floor((W+s.length)/2)).padEnd(W);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function getVal(id){return (document.getElementById(id).value||'').toUpperCase();}

function buildLines(){
  var nombre=getVal('nombre');
  var dir=getVal('direccion');
  var folio=getVal('folio');
  var fr=document.getElementById('fecha').value;
  var hr=document.getElementById('hora').value;
  var mesa=getVal('mesa');
  var pers=getVal('personas');
  var orden=getVal('orden');
  var mesero=getVal('mesero');
  var terminal=getVal('terminal');
  var totalArts=getVal('totalArts');
  var subtotal=getVal('subtotal');
  var iva=getVal('iva');
  var total=getVal('total');
  var recibido=getVal('recibido');
  var cambio=getVal('cambio');

  var fecha='',hora='';
  if(fr){var pp=fr.split('-');fecha=pp[2]+'/'+pp[1]+'/'+pp[0];}
  if(hr){var hm=hr.split(':');var h=parseInt(hm[0]);hora=(h>12?h-12:(h||12)).toString().padStart(2,'0')+':'+hm[1]+' '+(h>=12?'PM':'AM');}

  var rows=getRows();
  var W=32;
  var L=[];
  function s(){L.push({t:'sep'});}
  function c(txt,bold){L.push({t:'c',txt:txt,bold:!!bold});}
  function l(txt,bold){L.push({t:'l',txt:txt,bold:!!bold});}

  s();c(nombre,true);if(dir)c(dir);s();
  c('¡GRACIAS POR SU VISITA!',true);s();
  l('ORDEN DE MESA');
  l('FOLIO: '+pd(folio,10)+' FECHA: '+fecha);
  l('MESA:  '+pd(mesa,10)+' HORA: '+hora);
  l('PERSONAS: '+pd(pers,6)+' ORDEN: '+orden);
  l('MESERO: '+mesero);s();
  l(pd('CANT',5)+' '+pd('DESCRIPCION',14)+' '+'IMPORTE',true);s();
  rows.forEach(function(r){
    l(pd(r.c,5)+' '+pd(r.d.slice(0,14),14)+' '+r.p);
  });
  s();
  l('TOTAL ARTICULOS: '+totalArts);s();
  l('SUBTOTAL:      '+subtotal);
  l('IVA (16%):     '+iva);
  l('TOTAL:         '+total,true);s();
  l('FORMA DE PAGO: '+pago);
  if(pago==='EFECTIVO'){
    l('MONTO RECIBIDO: '+recibido);
    l('CAMBIO:         '+cambio);
  }
  s();c('¡GRACIAS POR SU VISITA!',true);c('LOS ESPERAMOS PRONTO');s();
  l('TERMINAL:        '+terminal);s();
  c('¡FACTURA SOLICITALA AL',true);c('MOMENTO DEL PAGO!',true);s();
  return L;
}

function renderHTML(lines){
  var W=32;var html='';
  lines.forEach(function(ln){
    if(ln.t==='sep'){html+=esc(SEP)+'\n';}
    else{
      var txt=ln.txt||'';
      if(ln.t==='c') txt=ctr(txt,W);
      html+=(ln.bold?'<span class="b">'+esc(txt)+'</span>':esc(txt))+'\n';
    }
  });
  return html;
}

function renderTXT(lines){
  var W=32;var txt='';
  lines.forEach(function(ln){
    if(ln.t==='sep'){txt+=SEP+'\n';}
    else{var t=ln.txt||'';if(ln.t==='c') t=ctr(t,W);txt+=t+'\n';}
  });
  return txt;
}

function buildPY(lines){
  var py="from escpos.printer import Usb\n\nSEP = '*' * 32\np = Usb(0x0416, 0x5011, profile=\"TM-T88II\")\n\n";
  lines.forEach(function(ln){
    if(ln.t==='sep'){py+="p.set(align='left', bold=False)\np.text(SEP + \"\\n\")\n";}
    else{
      var al=ln.t==='c'?'center':'left';
      var bd=ln.bold?'True':'False';
      py+="p.set(align='"+al+"', bold="+bd+")\np.text("+JSON.stringify((ln.txt||'')+'\n')+")\n";
    }
  });
  py+="p.ln(3)\np.cut()\n";
  return py;
}

function refresh(){
  document.getElementById('ticketPreview').innerHTML=renderHTML(buildLines());
}

document.getElementById('btnDl').addEventListener('click',function(){
  var blob=new Blob([buildPY(buildLines())],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ticket.py';a.click();
});

document.getElementById('btnPrint').addEventListener('click',function(){
  var txt=renderTXT(buildLines())+'\n\n\n';
  var w=window.open('','_blank','width=320,height=700');
  w.document.write('<html><head><style>body{font-family:monospace;font-size:11px;white-space:pre;margin:0;padding:8px;}@media print{@page{margin:0;size:58mm auto;}}</style></head><body>'+esc(txt)+'</body></html>');
  w.document.close();w.focus();setTimeout(function(){w.print();},300);
});

window.addEventListener('load',function(){
  gsap.to('.site-header',{opacity:1,y:0,duration:.6,ease:'power3.out'});
  gsap.to('.card',{opacity:1,y:0,duration:.5,stagger:.08,ease:'power3.out',delay:.2});
  gsap.to('.ticket-preview',{opacity:1,y:0,duration:.5,ease:'power3.out',delay:.6});
  gsap.to('.actions',{opacity:1,duration:.4,delay:.8});
  ini.forEach(function(r){addRow(r.c,r.d,r.p);});
});
})();
</script>
</body>
</html>
