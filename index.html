<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Generador de Tickets</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0e0d;--paper:#faf6f0;--ink:#1a1612;
  --red:#c0392b;--gold:#c8a45a;--muted:#666;
  --border:#2a2620;--radius:4px;
  --mono:'IBM Plex Mono','Courier New',Courier,monospace;
  --display:'Bebas Neue',sans-serif;
}
body{background:var(--bg);min-height:100vh;font-family:var(--mono);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 12px 60px;color:var(--paper);}
.mode-tabs{width:100%;max-width:440px;display:flex;gap:0;margin-bottom:20px;
  border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.mode-tab{flex:1;padding:12px;background:#1a1814;color:var(--muted);
  font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;
  border:none;cursor:pointer;transition:all .25s;border-right:1px solid var(--border);}
.mode-tab:last-child{border-right:none;}
.mode-tab.active{background:var(--gold);color:var(--ink);font-weight:700;}
.site-header{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:28px;}
.layout{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;}
.card{background:#1a1814;border:1px solid var(--border);border-radius:6px;padding:16px;}
.card-title{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
input{background:#0f0e0d;border:1px solid var(--border);border-radius:var(--radius);
  color:var(--paper);font-family:var(--mono);font-size:13px;padding:8px 10px;
  width:100%;transition:border-color .2s;text-transform:uppercase;}
input[type=date],input[type=time]{text-transform:none;}
input:focus{outline:none;border-color:var(--gold);}
.pago-toggle{display:flex;gap:8px;}
.pago-btn{flex:1;padding:9px;border-radius:var(--radius);border:1px solid var(--border);
  background:#0f0e0d;color:var(--muted);font-family:var(--mono);font-size:11px;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.pago-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700;}
.productos-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.producto-row{display:grid;grid-template-columns:44px 1fr 80px 32px;gap:6px;align-items:center;}
.producto-row input{padding:7px 8px;font-size:12px;}
.super-row{display:grid;grid-template-columns:36px 1fr 68px 68px 32px;gap:5px;align-items:center;}
.super-row input{padding:7px 8px;font-size:12px;}
.btn-remove{background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:var(--radius);width:32px;height:36px;cursor:pointer;font-size:18px;
  transition:all .2s;display:flex;align-items:center;justify-content:center;}
.btn-remove:hover{border-color:var(--red);color:var(--red);}
.btn-add{background:none;border:1px dashed var(--border);color:var(--muted);
  border-radius:var(--radius);width:100%;padding:9px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:all .2s;}
.btn-add:hover{border-color:var(--gold);color:var(--gold);}
.ticket-preview{background:var(--paper);color:var(--ink);border-radius:6px;
  padding:20px 16px;font-family:var(--mono);font-size:11px;line-height:1.6;
  white-space:pre;overflow-x:auto;position:relative;}
.ticket-preview::before{content:'VISTA PREVIA';position:absolute;top:-10px;left:16px;
  background:var(--gold);color:var(--ink);font-size:8px;letter-spacing:3px;
  padding:2px 8px;border-radius:2px;font-weight:700;}
.ticket-preview .b{font-weight:700;}
.actions{display:flex;gap:10px;}
.btn-print{flex:1;background:var(--gold);color:var(--ink);border:none;
  border-radius:var(--radius);font-family:var(--mono);font-size:12px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;padding:14px;cursor:pointer;transition:all .2s;}
.btn-print:hover{background:#d4a830;transform:translateY(-1px);}
.btn-dl{background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:var(--radius);font-family:var(--mono);font-size:11px;
  letter-spacing:2px;text-transform:uppercase;padding:14px 16px;cursor:pointer;transition:all .2s;}
.btn-dl:hover{border-color:var(--paper);color:var(--paper);}
.cols-label{display:grid;gap:6px;margin-bottom:4px;}
.cols-label.casino-cols{grid-template-columns:44px 1fr 80px 32px;}
.cols-label.super-cols{grid-template-columns:36px 1fr 68px 68px 32px;}
.cols-label span{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.logo-upload-area{background:#0f0e0d;border:1px dashed var(--border);border-radius:var(--radius);
  padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s;}
.logo-upload-area:hover{border-color:var(--gold);}
.logo-upload-area input{display:none;}
.logo-placeholder-txt{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.logo-hint{font-size:8px;color:var(--muted);margin-top:2px;}
.chain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.chain-btn{padding:9px 6px;border-radius:var(--radius);border:1px solid var(--border);
  background:#0f0e0d;color:var(--muted);font-family:var(--mono);font-size:10px;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.chain-btn:hover{border-color:var(--gold);color:var(--gold);}
.chain-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700;}
.section-hidden{display:none;}
</style>
</head>
<body>

<div class="mode-tabs" id="modeTabs">
  <button class="mode-tab active" data-mode="casino">🍽 Restaurante</button>
  <button class="mode-tab" data-mode="super">🛒 Supermercado</button>
</div>


<!-- ===== CASINO MODE ===== -->
<div class="layout" id="casinoMode">
  <div class="card">
    <div class="card-title">Negocio</div>
    <div class="grid-2">
      <div class="field full"><label>Nombre</label><input id="c_nombre" value="RESTAURANTE SALON CASINO"/></div>
      <div class="field full"><label>Direccion (opcional)</label><input id="c_direccion" placeholder="CALLE, COL., CIUDAD"/></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Orden</div>
    <div class="grid-2">
      <div class="field"><label>Folio</label><input id="c_folio" value="001234"/></div>
      <div class="field"><label>Fecha</label><input id="c_fecha" type="date"/></div>
      <div class="field"><label>Mesa</label><input id="c_mesa" value="18"/></div>
      <div class="field"><label>Hora</label><input id="c_hora" type="time"/></div>
      <div class="field"><label>Personas</label><input id="c_personas" value="3"/></div>
      <div class="field"><label>Orden #</label><input id="c_orden" value="4"/></div>
      <div class="field full"><label>Mesero</label><input id="c_mesero" value="TELLEZ HERNANDEZ PEDRO"/></div>
      <div class="field full"><label>Terminal</label><input id="c_terminal" value="2-PDV1"/></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Productos</div>
    <div class="cols-label casino-cols">
      <span>Cant</span><span>Descripcion</span><span>Importe</span><span></span>
    </div>
    <div class="productos-list" id="c_productosList"></div>
    <button class="btn-add" id="c_btnAdd">+ Agregar producto</button>
  </div>
  <div class="card">
    <div class="card-title">Totales</div>
    <div class="grid-2">
      <div class="field"><label>Total articulos</label><input id="c_totalArts" value="36"/></div>
      <div class="field"><label>Subtotal</label><input id="c_subtotal" value="$1,545.00"/></div>
      <div class="field"><label>IVA (16%)</label><input id="c_iva" value="$247.20"/></div>
      <div class="field"><label>Total</label><input id="c_total" value="$1,792.00"/></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Pago</div>
    <div class="grid-2">
      <div class="field full"><label>Forma de pago</label>
        <div class="pago-toggle">
          <button class="pago-btn active" id="c_btnEfectivo">Efectivo</button>
          <button class="pago-btn" id="c_btnTerminal">Terminal</button>
        </div>
      </div>
      <div class="field" id="c_campoRecibido"><label>Monto recibido</label><input id="c_recibido" value="$1,800.00"/></div>
      <div class="field" id="c_campoCambio"><label>Cambio</label><input id="c_cambio" value="$7.80"/></div>
    </div>
  </div>
  <div class="ticket-preview" id="c_ticketPreview"></div>
  <div class="actions">
    <button class="btn-dl" id="c_btnDl">Descargar .py</button>
    <button class="btn-print" id="c_btnPrint">Imprimir Ticket</button>
  </div>
</div>

<!-- ===== SUPER MODE ===== -->
<div class="layout section-hidden" id="superMode">
  <div class="card">
    <div class="card-title">Cadena</div>
    <div class="chain-grid" id="s_chainGrid">
      <button class="chain-btn active" data-key="soriana">Soriana</button>
      <button class="chain-btn"        data-key="walmart">Walmart</button>
      <button class="chain-btn"        data-key="costco">Costco</button>
      <button class="chain-btn"        data-key="sams">Sam's Club</button>
      <button class="chain-btn"        data-key="chedraui">Chedraui</button>
    </div>
    <div style="margin-top:12px;background:#fff;border-radius:4px;padding:12px;height:90px;display:flex;align-items:center;justify-content:center;">
      <img src="" alt="logo" id="s_logoPreviewThumb"
           style="max-width:240px;max-height:66px;object-fit:contain;display:block;"/>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Negocio</div>
    <div class="grid-2">
      <div class="field full"><label>Nombre tienda</label><input id="s_nombre" value="TACUBAYA"/></div>
      <div class="field full"><label>Razon Social</label><input id="s_razon" value="TIENDAS SORIANA, S.A. DE C.V. TS0991022PB6"/></div>
      <div class="field full"><label>Regimen</label><input id="s_regimen" value="REGIMEN GENERAL DE LEY PERSONAS MORALES"/></div>
      <div class="field full"><label>Direccion</label><input id="s_direccion" value="GRAL JOSE MORAN 3"/></div>
      <div class="field full"><label>Col / CP</label><input id="s_colonia" value="SAN MIGUEL CHAPULTEPEC 11850"/></div>
      <div class="field"><label>Telefono</label><input id="s_tel" value="25745015102"/></div>
      <div class="field"><label>Fecha</label><input id="s_fecha" type="date"/></div>
      <div class="field"><label>Hora</label><input id="s_hora" type="time"/></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Productos</div>
    <div class="cols-label super-cols">
      <span>Cant</span><span>Articulo</span><span>Pre.Unit</span><span>Total</span><span></span>
    </div>
    <div class="productos-list" id="s_productosList"></div>
    <button class="btn-add" id="s_btnAdd">+ Agregar producto</button>
  </div>
  <div class="card">
    <div class="card-title">Totales</div>
    <div class="grid-2">
      <div class="field"><label>Total articulos</label><input id="s_totalArts" value="35"/></div>
      <div class="field"><label>Total</label><input id="s_total" value="$1,540.10"/></div>
      <div class="field full"><label>Forma de pago</label>
        <div class="pago-toggle">
          <button class="pago-btn active" id="s_btnEfectivo">Efectivo</button>
          <button class="pago-btn" id="s_btnTarjeta">Tarjeta</button>
        </div>
      </div>
      <div class="field"><label>Monto recibido</label><input id="s_recibido" value="$1,540.10"/></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Beneficios / Pie de ticket</div>
    <div class="grid-2">
      <div class="field full"><label>Ahorro total</label><input id="s_ahorro" value="-104.00"/></div>
      <div class="field full"><label>Puntos acumulados</label><input id="s_puntos" value="192"/></div>
      <div class="field full"><label>Atiendio</label><input id="s_atiendio" value="REGINA MIREL GONZALEZ MIRANDA"/></div>
      <div class="field full"><label>Mensaje pie (opcional)</label><input id="s_mensajePie" value="HOLA !!! GRACIAS POR TU COMPRA!!!"/></div>
      <div class="field full"><label>Sitio web</label><input id="s_web" value="AVISO PRIVACIDAD: WWW.SORIANA.COM/CONDICIONES"/></div>
      <div class="field full"><label>Slogan marca</label><input id="s_slogan" value="MARCA SORIANA: CALIDAD AL MEJOR PRECIO"/></div>
      <div class="field full"><label>Version</label><input id="s_version" value="VERSION: 4.41.0.0"/></div>
      <div class="field full"><label>Barcode (texto, opcional)</label><input id="s_barcode" value=""/></div>
    </div>
  </div>
  <div class="ticket-preview" id="s_ticketPreview"></div>
  <div class="actions">
    <button class="btn-dl" id="s_btnDl">Descargar .py</button>
    <button class="btn-print" id="s_btnPrint">Imprimir Ticket</button>
  </div>
</div>

/* =========================================================
   CONSTANTES DE ANCHO
   58mm ~ 32 chars en fuente monospace 9.6pt
   80mm ~ 42 chars
   ========================================================= */
var W_CASINO = 32;
var W_SUPER  = 42;
var SEP32 = '================================'; // 32 chars exactos
var SEP42 = '=========================================='; // 42 chars exactos

/* =========================================================
   NORMALIZAR — elimina caracteres no ASCII imprimibles
   ========================================================= */
var LATIN_MAP = {
  'á':'a','é':'e','í':'i','ó':'o','ú':'u',
  'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U',
  'ü':'u','Ü':'U','ñ':'n','Ñ':'N',
  '\u00a1':'!','\u00bf':'?',
  '\u2019':"'",'`':"'"
};
function normalize(s){
  s = String(s || '');
  // Replace known accented / special chars
  s = s.replace(/[^\x00-\x7F]/g, function(c){
    return LATIN_MAP[c] !== undefined ? LATIN_MAP[c] : '';
  });
  return s;
}

/* =========================================================
   UTILS
   ========================================================= */
function pad(s,n,right){ s=normalize(s).slice(0,n); return right ? s.padEnd(n) : s.padStart(n); }
function center(s,W){ s=normalize(s).slice(0,W); return s.padStart(Math.floor((W+s.length)/2)).padEnd(W); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function gv(id){ var el=document.getElementById(id); return el ? normalize(el.value||'').toUpperCase() : ''; }
function gvRaw(id){ var el=document.getElementById(id); return el ? (el.value||'') : ''; }
function fmtDate(f){ if(!f) return ''; var p=f.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtTime(h){ if(!h) return ''; var hm=h.split(':'); var hr=parseInt(hm[0]); return (hr>12?hr-12:(hr||12)).toString().padStart(2,'0')+':'+hm[1]+' '+(hr>=12?'PM':'AM'); }
function mk(tag){ return document.createElement(tag||'input'); }

function upInput(el, cb){
  el.addEventListener('input', function(){
    if(this.type !== 'date' && this.type !== 'time') this.value = normalize(this.value).toUpperCase();
    cb();
  });
}

/* =========================================================
   WORD-WRAP — ajusta texto al ancho W sin romper palabras
   ========================================================= */
function wrapText(str, W){
  str = normalize(str);
  if(!str) return [];
  var words = str.split(' ');
  var lines = [];
  var cur = '';
  words.forEach(function(w){
    if(!w) return;
    if(!cur){ cur = w.slice(0,W); return; }
    if((cur + ' ' + w).length <= W){ cur += ' ' + w; }
    else { lines.push(cur); cur = w.slice(0,W); }
  });
  if(cur) lines.push(cur);
  return lines;
}

/* =========================================================
   LINE BUILDER helpers
   ========================================================= */
// Returns array of line objects: {t:'sep'|'c'|'l', txt, bold}
function makeLine(type, txt, bold){ return {t:type, txt:normalize(String(txt||'')), bold:!!bold}; }

/* =========================================================
   RENDER LINE OBJECTS → HTML preview
   ========================================================= */
function renderHTML(lines, W, SEP){
  var html = '';
  lines.forEach(function(ln){
    if(ln.t === 'sep'){ html += esc(SEP) + '\n'; return; }
    var txt = ln.txt || '';
    if(ln.t === 'c') txt = center(txt, W);
    else             txt = pad(txt, W, true); // left-aligned, pad right
    html += ln.bold ? '<span class="b">'+esc(txt)+'</span>\n' : esc(txt)+'\n';
  });
  return html;
}

/* =========================================================
   RENDER → plain text (for print window)
   ========================================================= */
function renderTXT(lines, W, SEP){
  var txt = '';
  lines.forEach(function(ln){
    if(ln.t === 'sep'){ txt += SEP + '\n'; return; }
    var t = ln.txt || '';
    if(ln.t === 'c') t = center(t, W);
    txt += t + '\n';
  });
  return txt;
}

/* =========================================================
   RENDER → Python ESC/POS
   ========================================================= */
function buildPY(lines, SEP, W){
  var charset = "p.charcode('PC437_USA')\n"; // ASCII-safe codepage
  var py = "# -*- coding: utf-8 -*-\nfrom escpos.printer import Usb\n\n"
         + "SEP = '" + SEP + "'\n"
         + "p = Usb(0x0416, 0x5011, profile='TM-T88II')\n"
         + charset + "\n";
  lines.forEach(function(ln){
    if(ln.t === 'sep'){
      py += "p.set(align='left', bold=False)\np.text(SEP + '\\n')\n";
    } else {
      var al = ln.t === 'c' ? 'center' : 'left';
      var bd = ln.bold ? 'True' : 'False';
      py += "p.set(align='" + al + "', bold=" + bd + ")\n"
          + "p.text(" + JSON.stringify(normalize(ln.txt||'') + '\n') + ")\n";
    }
  });
  py += "p.ln(3)\np.cut()\n";
  return py;
}
